# LinkMovie local study stack.
# Default `docker compose up`: Postgres, MinIO, RabbitMQ, migrate.
# Profile `apps`: placeholder api / worker / web with shared env wiring.

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-linkmovie}:${POSTGRES_PASSWORD:-linkmovie}@postgres:5432/${POSTGRES_DB:-linkmovie}?schema=public
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-linkmovie}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-linkmovie}:${RABBITMQ_DEFAULT_PASS:-linkmovie}@rabbitmq:5672
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkmovie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkmovie}
      POSTGRES_DB: ${POSTGRES_DB:-linkmovie}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-linkmovie} -d ${POSTGRES_DB:-linkmovie}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-linkmovie}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-linkmovie}
    ports:
      - "5672:5672"
      - "15672:15672"
    # Ephemeral broker data — topology is declared on Api/Worker boot.
    # A named volume for /var/lib/rabbitmq often hits .erlang.cookie eacces on WSL/Docker.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkmovie}:${POSTGRES_PASSWORD:-linkmovie}@postgres:5432/${POSTGRES_DB:-linkmovie}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    environment:
      <<: *app-env
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
